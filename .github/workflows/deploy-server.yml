# Deploys the munnel server to the AWS host (tunnels.momentumpay.xyz).
#
# Manually triggered only (Actions tab → "Deploy server" → Run workflow), and
# only from main. Everything runs on GitHub-hosted runners: the deploy job
# assumes an AWS role through GitHub's OIDC provider and sends one SSM
# Run Command to the host. There is no runner on the host, no inbound port
# (the host has no SSH), and no secret in GitHub: the role is assumed with a
# short-lived token, and the live .env (tunnel token, signing key, session key)
# lives in AWS Secrets Manager and is rendered on the host.
#
# The SSM command fetches the commit being deployed from GitHub on the host,
# then runs deploy/aws-ssm/host-deploy.sh, which rsyncs the source to
# /opt/munnel (preserving Caddyfile), renders .env, rebuilds the Docker image,
# restarts the stack, reloads Caddy and checks /healthz and the ask endpoint.
#
# Test job runs on a GitHub-hosted ubuntu runner; the deploy job only starts
# after tests pass (or are skipped).
#
# One-time setup: apply the landing-zone root `munnel-nonprod` (host, secret,
# deploy role), then set three repository variables from its outputs:
# MUNNEL_DEPLOY_ROLE_ARN, MUNNEL_INSTANCE_ID and MUNNEL_AWS_REGION. See
# docs/OPERATIONS.md §6. The role trusts this repo's main-branch OIDC subject
# only, so the deploy job must not use an `environment:` (that changes the
# subject and the role refuses it).

name: Deploy server

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run `go test -race ./...` before deploying
        type: boolean
        default: true
      caddy_reload:
        description: Reload Caddy after deploy (pick up Caddyfile changes)
        type: boolean
        default: true

# Only one deploy at a time — a rebuild mid-deploy could corrupt the stack.
concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  test:
    if: inputs.run_tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run tests
        run: go test -race ./...

  deploy:
    needs: test
    # Run even if the test job was skipped (run_tests=false), but not if it
    # failed or was cancelled. Only from main: the AWS role trusts main only.
    if: always() && github.ref == 'refs/heads/main' && needs.test.result != 'failure' && needs.test.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.MUNNEL_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.MUNNEL_AWS_REGION }}
          role-session-name: munnel-deploy-${{ github.run_id }}

      - name: Deploy over SSM
        # Inputs and variables reach the script through env, never by
        # interpolation into the script text.
        env:
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          INSTANCE: ${{ vars.MUNNEL_INSTANCE_ID }}
          CADDY_RELOAD: ${{ inputs.caddy_reload }}
        run: |
          set -euo pipefail
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::unexpected commit id"
            exit 1
          fi
          if ! [[ "$INSTANCE" =~ ^i-[0-9a-f]+$ ]]; then
            echo "::error::repository variable MUNNEL_INSTANCE_ID is not set to an instance id"
            exit 1
          fi
          flags=""
          if [ "$CADDY_RELOAD" != "true" ]; then
            flags="--no-caddy-reload"
          fi

          # What runs on the host, as root. The commit id and flags are the
          # first two lines (set by jq); the rest is fixed text. `set -eu` here
          # because the SSM shell may be dash; host-deploy.sh is bash and sets
          # pipefail itself.
          script=$(cat <<'REMOTE'
          set -eu
          export HOME="${HOME:-/root}"
          . /etc/munnel/host.env
          [ -d "$MUNNEL_SRC/.git" ] || git clone --no-checkout "$MUNNEL_REPO_URL" "$MUNNEL_SRC"
          git -C "$MUNNEL_SRC" fetch --depth 1 origin "$sha"
          git -C "$MUNNEL_SRC" checkout --detach --force "$sha"
          bash "$MUNNEL_SRC/deploy/aws-ssm/host-deploy.sh" "$sha" $flags
          REMOTE
          )
          params=$(jq -n --arg script "$script" --arg sha "$SHA" --arg flags "$flags" '{
            commands: (["sha=" + $sha, "flags=" + $flags]
                       + ($script | split("\n") | map(select(length > 0)))),
            executionTimeout: ["900"]
          }')

          cmd_id=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE" \
            --comment "munnel deploy ${SHA:0:7} run $RUN_ID" \
            --timeout-seconds 900 \
            --parameters "$params" \
            --query Command.CommandId --output text)
          echo "SSM command $cmd_id sent to the host"

          # Poll every 10 s, up to 18 min, until the command reaches a final
          # status. The invocation can be missing for the first few seconds.
          inv='{}'
          status=""
          finished=false
          for _ in $(seq 1 108); do
            sleep 10
            if ! inv=$(aws ssm get-command-invocation --command-id "$cmd_id" \
                --instance-id "$INSTANCE" --output json 2>"$RUNNER_TEMP/ssm-err"); then
              if grep -q InvocationDoesNotExist "$RUNNER_TEMP/ssm-err"; then
                inv='{}'
                continue
              fi
              cat "$RUNNER_TEMP/ssm-err" >&2
              echo "::error::could not read the result of SSM command $cmd_id"
              exit 1
            fi
            status=$(jq -r '.Status' <<<"$inv")
            case "$status" in
              Pending | InProgress | Delayed | Cancelling) ;;
              *)
                finished=true
                break
                ;;
            esac
          done

          # Every line is prefixed so host output can never start with `::` and
          # be taken for a workflow command.
          echo "=== host output (status: ${status:-unknown}) ==="
          jq -r '.StandardOutputContent // ""' <<<"$inv" | sed 's/^/| /'
          errout=$(jq -r '.StandardErrorContent // ""' <<<"$inv")
          if [ -n "$errout" ]; then
            echo "=== host stderr ==="
            printf '%s\n' "$errout" | sed 's/^/| /'
          fi

          if [ "$finished" != true ]; then
            echo "::error::gave up waiting for SSM command $cmd_id after 18 minutes (it may still be running on the host)"
            exit 1
          fi
          if [ "$status" != "Success" ]; then
            echo "::error::deploy failed: SSM command $cmd_id ended with status $status"
            exit 1
          fi
          echo "✓ deployed ${SHA:0:7}"
