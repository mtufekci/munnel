# Deploys the munnel server to the Azure dev VM (tunnels.momentumpay.xyz).
#
# Manually triggered only (Actions tab → "Deploy server" → Run workflow).
# A self-hosted GitHub Actions runner lives on the VM itself (label
# `munnel-dev`), so the deploy job runs directly on the VM — no SSH, no SCP,
# no inbound port changes. It checks out the repo, rsyncs the source to
# /opt/munnel (preserving the live .env), rebuilds the Docker image, and
# restarts the stack. The live .env (token, signing key, session key) is
# never touched — it's excluded from the rsync and already present on the VM.
#
# Test job runs on a GitHub-hosted ubuntu runner (the VM has no Go toolchain);
# the deploy job only starts after tests pass (or are skipped).
#
# One-time setup: install the self-hosted runner on the VM (see
# docs/OPERATIONS.md §6). No repository secrets are required — the runner
# authenticates to GitHub outbound and runs jobs locally.

name: Deploy server

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run `go test -race ./...` before deploying
        type: boolean
        default: true
      caddy_reload:
        description: Reload Caddy after deploy (pick up Caddyfile changes)
        type: boolean
        default: true

# Only one deploy at a time — a rebuild mid-deploy could corrupt the stack.
concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  test:
    if: inputs.run_tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run tests
        run: go test -race ./...

  deploy:
    needs: test
    # Run even if the test job was skipped (run_tests=false), but not if it
    # failed or was cancelled.
    if: always() && needs.test.result != 'failure' && needs.test.result != 'cancelled'
    # The runner is installed on the Azure VM itself (label: munnel-dev).
    runs-on: [self-hosted, munnel-dev]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Sync source to /opt/munnel
        run: |
          # Rsync the checkout into /opt/munnel. --delete keeps the deploy
          # clean (files removed from the repo are removed on the VM), but
          # .env is excluded so live secrets (token, signing key, session
          # key) survive. /opt/munnel is owned by a foreign UID from the
          # initial tar deploy, so sudo is required.
          sudo rsync -a --delete \
            --exclude=.env \
            --exclude=bin --exclude=dist --exclude=.git \
            --exclude=node_modules --exclude='*.tgz' \
            ./ /opt/munnel/
          # Regenerate Caddyfile from the template ({$MUNNEL_DOMAIN} env
          # substitution is read from .env at container start).
          sudo cp /opt/munnel/Caddyfile.example /opt/munnel/Caddyfile
          echo "✓ source synced to /opt/munnel"

      - name: Build and restart stack
        working-directory: /opt/munnel
        run: |
          sudo docker compose up -d --build
          echo "=== compose ps ==="
          sudo docker compose ps

      - name: Reload Caddy
        if: inputs.caddy_reload
        run: |
          sudo docker exec munnel-caddy-1 caddy reload --config /etc/caddy/Caddyfile 2>&1 \
            || sudo docker compose -f /opt/munnel/docker-compose.yml restart caddy

      - name: Health check
        run: |
          # The server takes a few seconds to bind after recreate. Poll from
          # the VM itself (the ingress is bound to 127.0.0.1:8080, not the
          # public IP).
          for i in $(seq 1 12); do
            if curl -sf http://localhost:8080/healthz; then
              echo
              echo "✓ server healthy"
              exit 0
            fi
            echo "  …waiting (attempt $i/12)"
            sleep 5
          done
          echo "::error::health check failed — server did not respond on :8080/healthz"
          exit 1

      - name: Dump server logs on failure
        if: failure()
        run: |
          sudo docker compose -f /opt/munnel/docker-compose.yml logs --tail=40 munnel-server 2>&1 || true